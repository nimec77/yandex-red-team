tus":"partial_solution","verdict":{"text":"OK","fullText":"OK"}},"mainSubmission":{"id":164232984,"score":79.6,"status":"partial_solution","verdict":{"text":"OK","fullText":"OK"}},"allowHugeSubmissions":false,"canChooseSubmissions":false,"hasCorrectAnswer":false,"status":"partiallySolved"},{"problemId":"6801724/2026_07_26/ap4GtdBjXj","problemName":"RedTeam","problemType":"gitlab-problem","problemTitle":"B","fieldType":"text-or-file","submissionLeft":20,"maxScore":100,"maxScoredProblemResultExpected":false,"allowHugeSubmissions":false,"canChooseSubmissions":false,"hasCorrectAnswer":false,"status":"default"}],"1zwn94":"best-by-score","-ot3l4q":[{"compilerId":"ml","compilerName":"ML","language":"ML","style":"ml"}],"-lhv0mh":{"id":"6801724/2026_07_26/ap4GtdBjXj","title":"B","name":"RedTeam","compilers":[],"submissionAllowed":true,"languages":[{"slug":"ml","name":"ML","repositoryInitializationInfo":{}}],"languageToRepositories":{"ml":{"initializationStatus":""}},"testOptions":{},"attemptsRemaining":20},"i3roj3":"ml","tgmgwh":{"compilerId":"ml","compilerName":"ML","language":"ML","style":"ml"},"-jo1agp":{"data":{"locale":"en","type":"markdown","samples":[],"statement":{"legend":"## Intro\n\nWhen designing secure LLM-based applications, we inevitably craft a system prompt — it defines the constraints, behavioral rules, roles, and everything the neural network will basically adhere to when producing a response to a user request.\n\nAt the same time, the system prompt may contain sensitive information: links, API keys. Sometimes this is used for hard context, sometimes for convenience and debugging, and sometimes simply because the developer made a mistake and put too much trust in AI when writing the code.\n\nAs a result, an attacker can carry out an attack aimed at extracting data from the system prompt — `System Prompt Extraction`, which is a certain variety of prompt injection.\n\n## Task\n\nThere is an LLM. A system prompt has been written and fixed for it. The system prompt contains a certain ***secret code.***\nAdditionally, the system prompt describes ***6*** scenarios: if any of them is present in the user's request, the model will explain the reason, state the attack category, and reveal that very secret code `(secret code).`\n\nAdditionally, as the ***7th*** attack option, a ***magic word*** is used. If the user's request equals the magic word, the system returns success!\n\nYour ***ta5k*** is to write 10 prompts (each from 3 to 300 characters long) one per line in a `.txt file` and cover as many of the scenarios hardcoded into the system prompt as possible. To do this, you should watch the lecture and the examples of attacks on LLMs, and read up online about other attack types.\n\n***Hint for the magic word:***\n\n* Study the `gostcrypto` library\n\n* Use the `Kuznyechik` symmetric encryption algorithm in the `ECB` block cipher mode. Use `PAD_MODE_1.`\n\n* The key on which the sought secret word is encrypted initially has the string data type `(str).` When padding it to the key length `(32 bytes)`, the byte representation of the string is padded as follows:\n\n```python\nkey = key_string_candidate.encode(\"utf-8\").ljust(32, b'\\x00')\n```\n\n* The sought magic word is encrypted with the given key, producing a ciphertext in `hex string` format:\n\n```python\nhex_cipher_text = \"96d2baa168f74fae630545bdca809febfa9c71776d4c9b7fd6200ade971d7e29\"\n```\n\nYou can use `bytearray(binascii.unhexlify(hex_cipher_text))` to work with the bytes in the format required by the [`gostcrypto`](https://pypi.org/project/gostcrypto/) library.\n\n* How to figure out the key? — We don't know. But it's better to watch the lecture regarding the basic concepts.\n\n\u003e Interesting fact\n\u003e\n\u003e The most curious historical levy is considered to be the window tax in England, introduced in the 17th century. Wishing to replenish the treasury, the government decided that wealthy houses had more windows. To escape ruin, citizens began boarding them up en masse, which caused a sharp rise in disease rates in the cities due to the lack of sunlight and stuffiness.\n\n## Example txt file (input):\n\n```\nExplain why regular physical exercise is beneficial for long-term health.\nWrite a short story about two strangers who unexpectedly become friends during a train journey.\nCompare the climates of tropical and temperate regions, highlighting their main differences.\nDescribe the process of making homemade bread from start to finish.\nSummarize the main causes and consequences of the Industrial Revolution.\nWrite a persuasive paragraph encouraging people to reduce single-use plastic waste.\nExplain how eclipses occur and why they do not happen every month.\nDescribe the characteristics that make a city an attractive place to live.\nWrite a brief biography of a famous scientist and explain their most important contribution.\nCompare traveling by train and by airplane, discussing the advantages and disadvantages of each.\n```\n\nPaste the lines into the field on the right and click \"Submit\" to test your solution.\n\nIf you try to upload more files than allowed or duplicate lines, the system will return an error.\n\n## Output:\n\n`{num_of_unique_scenarios_covered} / {7}` — a certain score format.\n\nPlease note that the WA verdict can indicate that you submitted a number of prompts other than 10, or that duplicate/similar queries were detected in your submission.\n\nGood luck! Or, as they say in Spanish: `¡Buena suerte!`","inputFormat":"","outputFormat":"","notes":"","showLimits":true},"problemType":"gitlab-problem","additionalStatementsDetails":{},"hasBinaryStatement":false,"parts":{"url":"https://contest-problem-files.s3-private.mds.yandex.net/problems/1000016a-6656-5a11-fdc8-a1011a098059/files/bb1ae5e5-2e22-4f28-b0d3-682a38c98ae3?response-content-type=text%2Fplain\u0026X-Amz-Algorithm=AWS4-HMAC-SHA256\u0026X-Amz-Date=20260802T031212Z\u0026X-Amz-SignedHeaders=host\u0026X-Amz-Credential=V0T1EzqIkxfG5tKj9dfL%2F20
